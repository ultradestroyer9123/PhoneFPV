<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhoneFPV - Phone</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        video {
            width: 100%;
            max-width: 900px;
            border-radius: 10px;
            background: black;
        }

        #status {
            margin: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>PhoneFPV</h1>

<div id="status">Requesting camera...</div>

<video id="preview" autoplay playsinline muted></video>
<label style="
    display: block;
    margin: 15px auto;
    font-size: 18px;
">
    <input
        type="checkbox"
        id="computerControl"
    >
    Enable Computer Control
</label>
<script>

const statusText = document.getElementById("status");
const preview = document.getElementById("preview");

let pc;
let videoTrack;


// ------------------------------------------------------------
// Wait until ICE gathering is complete
// ------------------------------------------------------------

function waitForIceGatheringComplete(pc) {

    return new Promise(resolve => {

        if (pc.iceGatheringState === "complete") {
            resolve();
            return;
        }

        function checkState() {

            if (pc.iceGatheringState === "complete") {

                pc.removeEventListener(
                    "icegatheringstatechange",
                    checkState
                );

                resolve();
            }
        }

        pc.addEventListener(
            "icegatheringstatechange",
            checkState
        );
    });
}


// ------------------------------------------------------------
// Poll for computer's answer
// ------------------------------------------------------------

async function waitForAnswer() {

    while (true) {

        try {

            const response =
                await fetch("/signal/answer");

            const data =
                await response.json();

            if (data.answer) {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(data.answer)
                );

                statusText.textContent =
                    "Connected";

                return;
            }

        } catch (error) {

            console.error(error);
        }

        await new Promise(resolve =>
            setTimeout(resolve, 500)
        );
    }
}


// ------------------------------------------------------------
// Get current settings
// ------------------------------------------------------------

async function updateSettings() {

    try {

        const response =
            await fetch("/settings");

        const data =
            await response.json();

        if (!videoTrack || !pc) {
            return;
        }

        const sender =
            pc.getSenders().find(
                sender => sender.track === videoTrack
            );

        if (!sender) {
            return;
        }

        const parameters =
            sender.getParameters();

        if (
            !parameters.encodings ||
            parameters.encodings.length === 0
        ) {

            parameters.encodings = [{}];
        }

        const encoding =
            parameters.encodings[0];


        // FPS slider directly controls maximum FPS.

        encoding.maxFramerate =
            data.fps;


        // Convert quality percentage into
        // an approximate bitrate.
        //
        // 10%  ≈ 250 kbps
        // 70%  ≈ 4.6 Mbps
        // 100% ≈ 8 Mbps
        //
        // This is NOT JPEG quality anymore.

        const minBitrate =
            250_000;

        const maxBitrate =
            8_000_000;

        const quality =
            data.quality / 100;

        encoding.maxBitrate =
            minBitrate +
            (maxBitrate - minBitrate) * quality;


        await sender.setParameters(
            parameters
        );

    } catch (error) {

        console.error(
            "Settings error:",
            error
        );
    }
}


// ------------------------------------------------------------
// Send phone battery percentage to Flask
// ------------------------------------------------------------

async function sendBattery() {

    try {

        const battery =
            await navigator.getBattery();

        const percentage =
            Math.round(
                battery.level * 100
            );


        await fetch("/battery", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                battery: percentage
            })

        });


        console.log(
            "Phone battery:",
            percentage + "%"
        );

    } catch (error) {

        console.error(
            "Battery error:",
            error
        );
    }
}


// ------------------------------------------------------------
// Main WebRTC setup
// ------------------------------------------------------------

async function start() {

    try {

        statusText.textContent =
            "Requesting camera permission...";


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30,
                        max: 60
                    }
                },

                audio: false
            });


        preview.srcObject =
            stream;

        videoTrack =
            stream.getVideoTracks()[0];

        statusText.textContent =
            "Camera ready. Waiting for computer...";


        // ----------------------------------------------------
        // Create peer connection
        // ----------------------------------------------------

        pc =
            new RTCPeerConnection({
                iceServers: []
            });


        // Add camera track

        pc.addTrack(
            videoTrack,
            stream
        );


        pc.onconnectionstatechange =
            () => {

                console.log(
                    "Connection:",
                    pc.connectionState
                );


                if (
                    pc.connectionState ===
                    "connected"
                ) {

                    statusText.textContent =
                        "Connected to computer";

                } else if (

                    pc.connectionState ===
                    "disconnected" ||

                    pc.connectionState ===
                    "failed"

                ) {

                    statusText.textContent =
                        "Connection lost";
                }
            };


        // ----------------------------------------------------
        // Create offer
        // ----------------------------------------------------

        const offerDescription =
            await pc.createOffer();


        await pc.setLocalDescription(
            offerDescription
        );


        // Wait until ICE candidates
        // have been added

        await waitForIceGatheringComplete(
            pc
        );


        // ----------------------------------------------------
        // Send complete SDP offer to Flask
        // ----------------------------------------------------

        await fetch(
            "/signal/offer",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    offer:
                        pc.localDescription
                })
            }
        );


        // ----------------------------------------------------
        // Wait for computer
        // ----------------------------------------------------

        await waitForAnswer();


        // Apply settings immediately

        await updateSettings();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera/WebRTC error: " +
            error.message;
    }
}


// ------------------------------------------------------------
// Check settings every 500 ms.
//
// This is ONLY one tiny request every half-second.
// It is NOT one request per video frame.
// ------------------------------------------------------------

setInterval(
    updateSettings,
    1500
);


// ------------------------------------------------------------
// Battery reporting
//
// Send immediately when PhoneFPV starts,
// then once every 60 seconds.
// ------------------------------------------------------------

sendBattery();

setInterval(
    sendBattery,
    60000
);


// ------------------------------------------------------------
// Start PhoneFPV
// ------------------------------------------------------------

start();

// ------------------------------------------------------------
// COMPUTER CONTROL + AUDIO TRANSMITTER
// ------------------------------------------------------------
//
// When Computer Control is OFF:
//     No /controller requests.
//     No audio.
//
// When Computer Control is ON:
//     Fetch /controller.
//     Convert the controller state into audio tones.
//     Send those tones through the phone's normal audio output.
//
// IMPORTANT:
// The browser cannot read the phone's system volume.
// The gain below controls the signal generated by this page.
// ------------------------------------------------------------


const computerControl =
    document.getElementById("computerControl");


let computerControlTimer = null;


// ------------------------------------------------------------
// AUDIO
// ------------------------------------------------------------

let audioContext = null;
let audioGain = null;
let audioOscillator = null;


// Software-controlled output level.
//
// Start deliberately LOW.
// Increase only after the receiving electronics are known
// to be electrically protected.
//
// 0.05 = 5% of Web Audio full-scale amplitude.
//
const AUDIO_GAIN = 0.05;


// ------------------------------------------------------------
// Create audio transmitter
// ------------------------------------------------------------

async function startAudioTransmitter() {

    if (!audioContext) {

        audioContext =
            new AudioContext();


        audioGain =
            audioContext.createGain();


        audioGain.gain.value =
            AUDIO_GAIN;


        audioGain.connect(
            audioContext.destination
        );


        audioOscillator =
            audioContext.createOscillator();


        audioOscillator.type =
            "sine";


        audioOscillator.frequency.value =
            1000;


        audioOscillator.connect(
            audioGain
        );


        audioOscillator.start();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();

    }


    console.log(
        "Audio transmitter started"
    );

}


// ------------------------------------------------------------
// Stop audio transmitter
// ------------------------------------------------------------

function stopAudioTransmitter() {

    if (!audioContext) {
        return;
    }


    if (audioGain) {

        audioGain.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            0.01
        );

    }


    console.log(
        "Audio transmitter stopped"
    );

}


// ------------------------------------------------------------
// Set the transmitted frequency
// ------------------------------------------------------------

function setAudioFrequency(
    frequency
) {

    if (
        !audioContext ||
        !audioOscillator
    ) {
        return;
    }


    audioOscillator.frequency.setTargetAtTime(
        frequency,
        audioContext.currentTime,
        0.002
    );


    if (audioGain) {

        audioGain.gain.setTargetAtTime(
            AUDIO_GAIN,
            audioContext.currentTime,
            0.002
        );

    }

}


// ------------------------------------------------------------
// Encode controller state into a frequency
// ------------------------------------------------------------
//
// This is a FIRST TEST protocol.
//
// We deliberately use a small, predictable frequency range.
//
// 1200 Hz = STOP
// 1300 Hz = FORWARD
// 1400 Hz = BACKWARD
// 1500 Hz = LEFT
// 1600 Hz = RIGHT
// 1700 Hz = FORWARD-LEFT
// 1800 Hz = FORWARD-RIGHT
// 1900 Hz = BACKWARD-LEFT
// 2000 Hz = BACKWARD-RIGHT
//
// Throttle and steering are transmitted afterward as
// additional tones.
//
// The Arduino side will eventually decode these tones.
//

function getDirectionFrequency(
    direction
) {

    const frequencies = {

        "stop":
            1200,

        "forward":
            1300,

        "backward":
            1400,

        "left":
            1500,

        "right":
            1600,

        "forward-left":
            1700,

        "forward-right":
            1800,

        "backward-left":
            1900,

        "backward-right":
            2000

    };


    return frequencies[
        direction
    ] || 1200;

}


// ------------------------------------------------------------
// Convert 0-100 value to frequency
// ------------------------------------------------------------
//
// 0   -> 2200 Hz
// 100 -> 3200 Hz
//
// This lets the Arduino measure the frequency and reconstruct
// the original number.
// ------------------------------------------------------------

function valueToFrequency(
    value
) {

    value =
        Math.max(
            0,
            Math.min(
                100,
                Number(value) || 0
            )
        );


    return (
        2200 +
        (value * 10)
    );

}


// ------------------------------------------------------------
// Transmit one controller state
// ------------------------------------------------------------

async function transmitController(
    data
) {

    if (
        !computerControl.checked
    ) {
        return;
    }


    if (!audioContext) {
        return;
    }


    // --------------------------------------------------------
    // Make sure audio is running
    // --------------------------------------------------------

    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();

    }


    // --------------------------------------------------------
    // If computer control itself is disabled,
    // transmit STOP.
    // --------------------------------------------------------

    if (!data.enabled) {

        setAudioFrequency(
            1200
        );

        return;

    }


    // --------------------------------------------------------
    // Direction
    // --------------------------------------------------------

    setAudioFrequency(
        getDirectionFrequency(
            data.direction
        )
    );


    // --------------------------------------------------------
    // Give the direction tone a short duration.
    //
    // Then send throttle.
    // --------------------------------------------------------

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                35
            )
    );


    // --------------------------------------------------------
    // Throttle
    // --------------------------------------------------------

    setAudioFrequency(
        valueToFrequency(
            data.throttle
        )
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                35
            )
    );


    // --------------------------------------------------------
    // Steering Dual Rate
    // --------------------------------------------------------

    setAudioFrequency(
        valueToFrequency(
            data.steeringDualRate
        )
    );

}


// ------------------------------------------------------------
// Fetch controller
// ------------------------------------------------------------

async function updateController() {

    if (
        !computerControl.checked
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                "/controller"
            );


        const data =
            await response.json();


        console.log(
            "Computer Controller:",
            data
        );


        await transmitController(
            data
        );


    } catch (error) {

        console.error(
            "Controller error:",
            error
        );

    }

}


// ------------------------------------------------------------
// Enable / Disable Computer Control
// ------------------------------------------------------------

computerControl.addEventListener(
    "change",
    async () => {


        if (
            computerControl.checked
        ) {

            console.log(
                "Computer Control ENABLED"
            );


            try {

                // Checkbox interaction counts as a
                // user interaction, which is useful because
                // browsers restrict unexpected audio playback.

                await startAudioTransmitter();


                // Fetch immediately

                await updateController();


                // Continue polling

                computerControlTimer =
                    setInterval(
                        updateController,
                        100
                    );


            } catch (error) {

                console.error(
                    "Could not start audio:",
                    error
                );

            }


        } else {


            console.log(
                "Computer Control DISABLED"
            );


            // Stop polling

            if (
                computerControlTimer !== null
            ) {

                clearInterval(
                    computerControlTimer
                );

                computerControlTimer =
                    null;

            }


            // Send STOP through audio
            // before muting the transmitter.

            if (audioContext) {

                setAudioFrequency(
                    1200
                );

            }


            stopAudioTransmitter();

        }

    }
);

</script>

</body>
</html>
